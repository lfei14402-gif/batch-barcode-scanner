name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # 固定为 24.04，避免 Ubuntu 26 迁移带来的不确定性
    steps:
      - uses: actions/checkout@v5  # 升级到 v5，支持 Node.js 24

      - name: Set up JDK 17
        uses: actions/setup-java@v5  # 升级到 v5，支持 Node.js 24
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4  # 升级到 v4，支持 Node.js 24

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4  # v4 目前仍可用，如需彻底消除 Node 警告可考虑升级到 v5
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: batch-barcode-debug
          path: app/build/outputs/apk/debug/app-debug.apk
